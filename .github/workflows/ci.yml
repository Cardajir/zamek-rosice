name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public: it ships in the client bundle. With it set the build includes
      # the Studio, as the deployed site does. Nothing is fetched from Sanity.
      PUBLIC_SANITY_PROJECT_ID: fhk95ye1
      PUBLIC_SANITY_DATASET: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
